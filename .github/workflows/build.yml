name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cài thư viện
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lưu bản build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
