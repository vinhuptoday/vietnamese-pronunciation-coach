name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cài thư viện
        run: bun install --frozen-lockfile

      - name: Build cho GitHub Pages
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          # Trang chạy tại https://<tên-tài-khoản>.github.io/<tên-repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Trang 404 dùng chung giao diện (để tải lại trang không lỗi)
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
